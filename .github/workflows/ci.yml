name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[curves,test]"
      - name: No machine-specific references
        run: python scripts/check_no_private_refs.py --history
      - name: Unit tests
        run: python -m pytest tests/unit -q
      - name: HNLimits regions regenerate byte for byte
        run: python -m curves.tools.hnlimits_process --check
      - name: End-to-end smoke pipeline
        run: python -m pytest tests/e2e -q
